<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#e5fffa"/>
      <stop offset="35%" stop-color="#00ffc8"/>
      <stop offset="100%" stop-color="#7a00ff"/>
    </radialGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#000814"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- outer boundary -->
  <circle cx="160" cy="160" r="152" fill="url(#bgGrad)" stroke="#00ffc8" stroke-width="2.5" filter="url(#glow)" opacity="0.95"/>
  <circle cx="160" cy="160" r="152" fill="none" stroke="#00ffc8" stroke-width="1" opacity="0.35"/>

  <!-- faint static orbit rings -->
  <circle cx="160" cy="160" r="60" fill="none" stroke="#00ffc8" stroke-width="1" opacity="0.18"/>
  <circle cx="160" cy="160" r="85" fill="none" stroke="#bd00ff" stroke-width="1" opacity="0.18"/>
  <circle cx="160" cy="160" r="108" fill="none" stroke="#ff2d78" stroke-width="1" opacity="0.16"/>

  <!-- radiating circuit ticks around the core -->
  <g stroke="#00ffc8" stroke-width="1.4" opacity="0.55" filter="url(#softGlow)">
    <line x1="160" y1="128" x2="160" y2="112"/>
    <line x1="188" y1="140" x2="199" y2="129"/>
    <line x1="200" y1="160" x2="216" y2="160"/>
    <line x1="188" y1="180" x2="199" y2="191"/>
    <line x1="160" y1="192" x2="160" y2="208"/>
    <line x1="132" y1="180" x2="121" y2="191"/>
    <line x1="120" y1="160" x2="104" y2="160"/>
    <line x1="132" y1="140" x2="121" y2="129"/>
  </g>

  <!-- orbiting agent A -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 160 160" to="360 160 160" dur="4.5s" repeatCount="indefinite"/>
    <line x1="160" y1="160" x2="220" y2="160" stroke="#00ffc8" stroke-width="1.2" opacity="0.45"/>
    <circle cx="220" cy="160" r="5.5" fill="#00ffc8" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- orbiting agent B -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 160 160" to="0 160 160" dur="6.5s" repeatCount="indefinite"/>
    <line x1="160" y1="160" x2="245" y2="160" stroke="#bd00ff" stroke-width="1.2" opacity="0.4"/>
    <circle cx="245" cy="160" r="6.5" fill="#bd00ff" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- orbiting agent C -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 160 160" to="360 160 160" dur="9s" repeatCount="indefinite"/>
    <line x1="160" y1="160" x2="268" y2="160" stroke="#ff2d78" stroke-width="1.2" opacity="0.35"/>
    <circle cx="268" cy="160" r="4.5" fill="#ff2d78" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- pulsing AI core -->
  <circle cx="160" cy="160" r="24" fill="url(#coreGrad)" filter="url(#glow)">
    <animate attributeName="r" values="22;27;22" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="160" r="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="24;34;24" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</svg>
